<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeting Poll — Match Members</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --border: #E2DDD6;
    --text: #1A1714;
    --muted: #7A736B;
    --always: #2D6A4F;
    --always-bg: #D8F3DC;
    --always-border: #95D5A8;
    --never: #9B2C2C;
    --never-bg: #FDE8E8;
    --never-border: #F9AAAA;
    --accent: #2C4A7C;
    --accent-bg: #E8EDF5;
    --accent-border: #A8BFDF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2.5rem 1.5rem 6rem;
  }
  .container { max-width: 960px; margin: 0 auto; }

  /* Login */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 360px;
    text-align: center;
  }
  .login-card h1 { font-family: 'DM Serif Display', serif; font-size: 1.6rem; font-weight: 400; margin-bottom: 0.4rem; }
  .login-card p { color: var(--muted); font-size: 14px; margin-bottom: 1.5rem; }
  .login-card input {
    width: 100%; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; font-family: 'DM Sans', sans-serif; font-size: 15px;
    background: var(--bg); color: var(--text); outline: none;
    margin-bottom: 0.75rem; text-align: center; letter-spacing: 0.1em;
  }
  .login-card input:focus { border-color: var(--accent); }
  .login-btn {
    width: 100%; padding: 11px; background: var(--accent); color: #fff;
    border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 500; cursor: pointer; transition: opacity 0.15s;
  }
  .login-btn:hover { opacity: 0.85; }
  .login-error { color: var(--never); font-size: 13px; margin-top: 0.5rem; min-height: 18px; }

  #main { display: none; }

  .page-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;
  }
  .page-header h1 { font-family: 'DM Serif Display', serif; font-size: 2rem; font-weight: 400; }
  .page-header p { color: var(--muted); font-size: 14px; margin-top: 0.25rem; }

  .btn {
    padding: 9px 18px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); font-family: 'DM Sans', sans-serif;
    font-size: 14px; cursor: pointer; color: var(--text); transition: all 0.15s; white-space: nowrap;
    text-decoration: none; display: inline-block;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .stats-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px; margin-bottom: 1.5rem;
  }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.9rem 1rem; }
  .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.3rem; }
  .stat-value { font-size: 22px; font-weight: 500; }

  /* Two-column layout */
  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 1.5rem;
    align-items: start;
  }

  /* Pool */
  .pool-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    position: sticky;
    top: 1.5rem;
  }
  .pool-header {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .pool-count {
    background: var(--accent-bg);
    color: var(--accent);
    border-radius: 20px;
    padding: 2px 8px;
    font-size: 12px;
    font-weight: 500;
  }
  .pool-body {
    padding: 0.5rem;
    max-height: calc(100vh - 200px);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .pool-empty {
    padding: 1.5rem 1rem;
    text-align: center;
    color: var(--always);
    font-size: 13px;
  }

  /* Draggable name chip */
  .name-chip {
    padding: 8px 12px;
    border-radius: 8px;
    background: var(--accent-bg);
    border: 1px solid var(--accent-border);
    color: var(--accent);
    font-size: 13px;
    font-weight: 500;
    cursor: grab;
    user-select: none;
    transition: transform 0.1s, box-shadow 0.1s, opacity 0.15s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .name-chip:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(44,74,124,0.15); }
  .name-chip:active { cursor: grabbing; }
  .name-chip.dragging { opacity: 0.4; }

  /* Members list */
  .members-panel { display: flex; flex-direction: column; gap: 6px; }

  .section-label {
    font-size: 12px; font-weight: 500; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em;
    margin-bottom: 0.25rem; margin-top: 0.5rem;
  }
  .section-label:first-child { margin-top: 0; }

  .member-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.6rem 1rem;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 0.75rem;
    transition: border-color 0.15s, background 0.15s;
    min-height: 56px;
  }
  .member-row.drop-target {
    border-color: var(--accent);
    background: var(--accent-bg);
  }
  .member-row.matched {
    border-color: var(--always-border);
    background: var(--always-bg);
  }

  .member-info .member-name { font-size: 14px; font-weight: 500; }
  .member-info .member-email { font-size: 11px; color: var(--muted); margin-top: 1px; }

  .match-slot {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 140px;
    justify-content: flex-end;
  }
  .drop-zone {
    flex: 1;
    min-height: 32px;
    border: 1.5px dashed var(--border);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--muted);
    padding: 0 8px;
    transition: border-color 0.15s, background 0.15s;
  }
  .drop-zone.active { border-color: var(--accent); background: var(--accent-bg); }
  .drop-zone.has-match {
    border-style: solid;
    border-color: var(--always-border);
    background: var(--always-bg);
    color: var(--always);
    font-weight: 500;
    font-size: 13px;
  }

  .unmatch-btn {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid var(--never-border);
    background: var(--never-bg);
    color: var(--never);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
    padding: 0;
  }
  .unmatch-btn:hover { background: var(--never); color: #fff; }

  /* Save bar */
  .save-bar {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.9rem 1.5rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    min-width: 400px;
    max-width: 600px;
    width: 90%;
  }
  .save-status { font-size: 14px; color: var(--muted); }
  .save-status.success { color: var(--always); }
  .save-status.error { color: var(--never); }

  .loading { color: var(--muted); font-size: 14px; padding: 2rem; text-align: center; }
</style>
</head>
<body>

<div class="login-wrap" id="login-wrap">
  <div class="login-card">
    <h1>Member matching</h1>
    <p>Enter the password to manage member matches</p>
    <input type="password" id="pw-input" placeholder="••••••••" />
    <button class="login-btn" onclick="checkPassword()">Continue</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div class="container">
  <div id="main">
    <div class="page-header">
      <div>
        <h1>Match members</h1>
        <p>Drag a name from the pool onto a Groups.io member to link them</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" onclick="loadAll()">↻ Refresh</button>
        <a href="results.html" class="btn">← Results</a>
      </div>
    </div>

    <div class="stats-row" id="stats-row"></div>

    <div class="layout">
      <div class="pool-panel">
        <div class="pool-header">
          <span>Respondents</span>
          <span class="pool-count" id="pool-count">0</span>
        </div>
        <div class="pool-body" id="pool-body">
          <div class="loading">Loading…</div>
        </div>
      </div>

      <div>
        <div class="members-panel" id="members-panel">
          <div class="loading">Loading members…</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="save-bar">
  <div class="save-status" id="save-status">Drag names from the pool onto members to match them.</div>
  <button class="btn primary" id="save-btn" onclick="saveMatches()">Save matches</button>
</div>

<script>
const PASSWORD = 'Schedule!';
const SUPABASE_URL = 'https://eqpqtswfkfmukzuhenjt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxcHF0c3dma2ZtdWt6dWhlbmp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1OTgwNzUsImV4cCI6MjA5NDE3NDA3NX0.jk1dbvSxwoSiOFFA7CeNJbJItXmJeDebU2D9rGtfvVA';

const hdrs = {
  'apikey': SUPABASE_ANON_KEY,
  'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
  'Content-Type': 'application/json',
};

let groupsMembers = [];   // [{email, name}]
let respondents = [];     // ['Alice', 'Bob', ...]
let matches = {};         // { email -> respondentName }
let dragName = null;

function checkPassword() {
  if (document.getElementById('pw-input').value === PASSWORD) {
    document.getElementById('login-wrap').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    loadAll();
  } else {
    document.getElementById('login-error').textContent = 'Incorrect password.';
  }
}
document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') checkPassword(); });

async function loadAll() {
  document.getElementById('pool-body').innerHTML = '<div class="loading">Loading…</div>';
  document.getElementById('members-panel').innerHTML = '<div class="loading">Loading…</div>';

  try {
    const [membersRes, respondentsRes, matchesRes] = await Promise.all([
      fetch(`${SUPABASE_URL}/functions/v1/groups-members`, { headers: hdrs }),
      fetch(`${SUPABASE_URL}/rest/v1/responses?select=name&order=name.asc`, { headers: hdrs }),
      fetch(`${SUPABASE_URL}/rest/v1/member_matches?select=*`, { headers: hdrs }),
    ]);

    const membersData = await membersRes.json();
    const respondentsData = await respondentsRes.json();
    const matchesData = await matchesRes.json();

    groupsMembers = (membersData.members || []).sort((a, b) =>
      (a.name || a.email).localeCompare(b.name || b.email)
    );
    respondents = [...new Set(respondentsData.map(r => r.name))].sort();
    matches = {};
    (matchesData || []).forEach(m => {
      if (m.respondent_name) matches[m.groups_io_email] = m.respondent_name;
    });

    render();
  } catch(e) {
    document.getElementById('members-panel').innerHTML = `<div class="loading">Error: ${e.message}</div>`;
  }
}

function usedNames() {
  return new Set(Object.values(matches));
}

function render() {
  renderPool();
  renderMembers();
  updateStats();
}

function renderPool() {
  const used = usedNames();
  const available = respondents.filter(r => !used.has(r));
  const poolEl = document.getElementById('pool-body');
  document.getElementById('pool-count').textContent = available.length;

  if (!available.length) {
    poolEl.innerHTML = '<div class="pool-empty">✓ All names matched</div>';
    return;
  }

  poolEl.innerHTML = available.map(name =>
    `<div class="name-chip" draggable="true" data-name="${escAttr(name)}"
      ondragstart="onDragStart(event, '${escJs(name)}')"
      ondragend="onDragEnd(event)"
    >${escHtml(name)}</div>`
  ).join('');
}

function renderMembers() {
  const panel = document.getElementById('members-panel');
  if (!groupsMembers.length) {
    panel.innerHTML = '<div class="loading">No members found.</div>';
    return;
  }

  const matched = groupsMembers.filter(m => matches[m.email]);
  const unmatched = groupsMembers.filter(m => !matches[m.email]);

  let html = '';

  if (unmatched.length) {
    html += `<div class="section-label">Unmatched (${unmatched.length})</div>`;
    html += unmatched.map(m => memberRowHtml(m)).join('');
  }

  if (matched.length) {
    html += `<div class="section-label" style="margin-top:1rem">Matched (${matched.length})</div>`;
    html += matched.map(m => memberRowHtml(m)).join('');
  }

  panel.innerHTML = html;
  attachDropZones();
}

function memberRowHtml(m) {
  const respondentName = matches[m.email] || null;
  const isMatched = !!respondentName;
  return `<div class="member-row ${isMatched ? 'matched' : ''}" id="row-${rowId(m.email)}">
    <div class="member-info">
      <div class="member-name">${escHtml(m.name || '—')}</div>
      <div class="member-email">${escHtml(m.email)}</div>
    </div>
    <div class="match-slot">
      <div class="drop-zone ${isMatched ? 'has-match' : ''}"
        data-email="${escAttr(m.email)}"
        ondragover="onDragOver(event)"
        ondragleave="onDragLeave(event)"
        ondrop="onDrop(event, '${escJs(m.email)}')"
      >${isMatched ? escHtml(respondentName) : 'drop here'}</div>
      ${isMatched ? `<button class="unmatch-btn" title="Remove match" onclick="unmatch('${escJs(m.email)}')">×</button>` : ''}
    </div>
  </div>`;
}

function attachDropZones() {
  // Already using inline handlers, nothing extra needed
}

function rowId(email) {
  return email.replace(/[^a-zA-Z0-9]/g, '_');
}

// Drag handlers
function onDragStart(e, name) {
  dragName = name;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', name);
  setTimeout(() => e.target.classList.add('dragging'), 0);
}

function onDragEnd(e) {
  e.target.classList.remove('dragging');
  dragName = null;
  document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('active'));
  document.querySelectorAll('.member-row').forEach(r => r.classList.remove('drop-target'));
}

function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('active');
  e.currentTarget.closest('.member-row').classList.add('drop-target');
}

function onDragLeave(e) {
  e.currentTarget.classList.remove('active');
  e.currentTarget.closest('.member-row').classList.remove('drop-target');
}

function onDrop(e, email) {
  e.preventDefault();
  const name = e.dataTransfer.getData('text/plain') || dragName;
  if (!name) return;
  e.currentTarget.classList.remove('active');
  e.currentTarget.closest('.member-row').classList.remove('drop-target');
  matches[email] = name;
  markUnsaved();
  render();
}

function unmatch(email) {
  delete matches[email];
  markUnsaved();
  render();
}

function updateStats() {
  const total = groupsMembers.length;
  const matched = Object.keys(matches).length;
  document.getElementById('stats-row').innerHTML = `
    <div class="stat-card"><div class="stat-label">Members</div><div class="stat-value">${total}</div></div>
    <div class="stat-card"><div class="stat-label">Matched</div><div class="stat-value" style="color:var(--always)">${matched}</div></div>
    <div class="stat-card"><div class="stat-label">Unmatched</div><div class="stat-value" style="color:var(--muted)">${total - matched}</div></div>
    <div class="stat-card"><div class="stat-label">In pool</div><div class="stat-value" style="color:var(--accent)">${respondents.length - matched}</div></div>
  `;
}

function markUnsaved() {
  const el = document.getElementById('save-status');
  el.textContent = 'You have unsaved changes.';
  el.className = 'save-status';
}

async function saveMatches() {
  const btn = document.getElementById('save-btn');
  const statusEl = document.getElementById('save-status');
  btn.disabled = true;
  btn.textContent = 'Saving…';

  try {
    const upserts = groupsMembers.map(m => ({
      groups_io_email: m.email,
      groups_io_name: m.name || m.email,
      respondent_name: matches[m.email] || null,
    }));

    const res = await fetch(`${SUPABASE_URL}/rest/v1/member_matches?on_conflict=groups_io_email`, {
      method: 'POST',
      headers: { ...hdrs, 'Prefer': 'resolution=merge-duplicates' },
      body: JSON.stringify(upserts),
    });

    if (!res.ok) throw new Error((await res.json()).message || `HTTP ${res.status}`);

    statusEl.textContent = `Saved at ${new Date().toLocaleTimeString()}`;
    statusEl.className = 'save-status success';
  } catch(e) {
    statusEl.textContent = `Error: ${e.message}`;
    statusEl.className = 'save-status error';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save matches';
  }
}

// Helpers
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) { return escHtml(s); }
function escJs(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
</script>
</body>
</html>
